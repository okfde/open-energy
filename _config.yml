title: Open Energy
description: >-
  Open Energy macht Wissen und Werkzeuge fur die Energiewende frei zuganglich –
  Anleitungen, Termine und Hintergrundwissen zum Selbermachen.
lang: de

url: "https://okfde.github.io"
baseurl: "/open-energy"

markdown: kramdown
future: true
permalink: /:categories/:title/

collections:
  blog:
    output: true
    permalink: /blog/:path/
  events:
    output: true
    permalink: /termine/:path/

defaults:
  - scope:
      path: ""
      type: "blog"
    values:
      layout: blog-article
  - scope:
      path: ""
      type: "events"
    values:
      layout: event-detail
  - scope:
      path: ""
    values:
      layout: default

nav_items:
  - title: Start
    url: /
  - title: Do it yourself
    url: /do-it-yourself/
  - title: Blog
    url: /blog/
  - title: Termine
    url: /termine/
  - title: About
    url: /about/

footer_legal:
  - title: Impressum
    url: /impressum/
  - title: Datenschutz
    url: /datenschutz/

social_links:
  - type: instagram
    title: Instagram
    url: "#"
  - type: facebook
    title: Facebook
    url: "#"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
