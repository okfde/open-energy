  cost_buy: "ab 900 €"
  cost_buy_note: "800-W-Set ab 300 € + Steckerspeicher 1 kWh ab 400 € + Einspeisesteckdose vom Elektriker ab 200 €"
  cost_diy: "ab 760 €"
  cost_diy_note: "neue Module, Akku mit 1 kWh selbst gebaut, Halterung selbst gebaut – Stecker statt Elektriker"
  cost_diy_items:
    - ["2 Solarmodule, zusammen ca. 800 Wp, neu", "160 €"]
    - ["Mikrowechselrichter 800 VA, neu", "150 €"]
    - ["Akku 1 kWh, selbst gebaut (4 LiFePO4-Zellen, BMS)", "200 €"]
    - ["MPPT-Laderegler für den Akku", "100 €"]
    - ["Absicherung: DC-Sicherung, Gehäuse", "50 €"]
    - ["Solarkabel, MC4-Stecker, Anschlusskabel mit Stecker", "50 €"]
    - ["Halterung aus Holz oder Alu, selbst gebaut", "50 €"]
  legal_fact: "800 W / 2.000 Wp"
  legal: "Keine Baugenehmigung, keine Anmeldung beim Netzbetreiber – nur vereinfacht ins Marktstammdatenregister."
  image: "/assets/images/illustrations/illu-balkonkraftwerk.png"
  match:
    "on": [miete-balkon, miete-garten, eigenheim-balkon, eigenheim-garten, kleingarten]
    "off": [miete-balkon, miete-garten, eigenheim-balkon, eigenheim-garten, kleingarten]

