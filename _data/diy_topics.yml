# Content-Karten auf /do-it-yourself/.
#
# Jede Karte verlinkt auf die Unterseite _diy/topics/<slug>.md
# (URL: /do-it-yourself/<slug>/). Die Unterseite holt sich diese Daten über
# ihr Front-Matter-Feld `category: <slug>`; Ressourcen aus
# _data/diy_resources.yml erscheinen dort, wenn ihre `categories` den slug
# enthalten.
#
# cost_buy / cost_diy: Mindestbeträge im günstigsten Fall (Stand 2026), keine Spannen.
#   cost_buy = „Kaufen & Beauftragen“: fertig kaufen, Fachbetrieb bzw. Elektriker
#     übernimmt Montage und Anschluss.
#   cost_diy = „Selbst bauen & sparen“: größtmögliche Eigenleistung – selbst
#     planen, montieren, verkabeln, Komponenten wie Akku oder Windrad selbst
#     bauen (nur Materialkosten). Ist ein Elektriker für den Anschluss nötig,
#     sind pauschal 1.500 € eingerechnet.
#   Module immer als Neuware, nie gebraucht.
#   cost_diy_items: Stückliste zum Selbstbau-Preis, immer inkl.
#     Leistungselektronik (Wechselrichter/Laderegler) und Absicherung.
#   Jede Variante enthält einen Akku: Kapazität in kWh = Leistung der
#     Anlage in kWp (bzw. kW beim Windrad).
#     Wird auf der Unterseite als Kostenaufstellung gezeigt.
# legal_fact / legal: Was ist rechtlich niederschwellig erlaubt? Kernfakt
#   (fett) und ein erläuternder Satz. Grundlage:
#   _diy/Solar_Kleinwind_genehmigungsfrei_Kurzuebersicht.md
# match: Für welche Antworten des Formular-Filters (_data/diy_filter.yml)
#   die Karte angezeigt wird – getrennt nach On-the-Grid und Off-the-Grid.

- slug: balkonsolar
  title: "Balkonsolar"
